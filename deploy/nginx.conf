# nginx-конфиг для контейнера «СПРАВОЧНИК СН-МНГ»
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Сжатие текстовых ресурсов (JS/CSS/HTML)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 1024;

    # Статика с хешированными именами — кэшируется надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой маршрут отдаёт index.html (без кэша, чтобы обновления сразу были видны)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Служебная проверка доступности для healthcheck/балансировщика
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
